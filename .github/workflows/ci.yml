name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pandoc
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q pandoc
      - name: Run the tests of every tool
        run: |
          status=0
          for dir in tools/*/; do
            name=$(basename "$dir")
            [ -f "$dir/test_$name.py" ] || { echo "::error::$dir has no test_$name.py"; status=1; continue; }
            echo "::group::$name"
            (cd "$dir" && python -m unittest -v "test_$name") || status=1
            echo "::endgroup::"
          done
          exit $status

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q pandoc
      - run: pip install -r requirements-dev.txt
      - name: Check the coverage table in README.md
        run: python scripts/coverage_readme.py --check
